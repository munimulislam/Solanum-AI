<!DOCTYPE html>
<html lang="en" data-theme="emerald">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SolanumAI{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <style>
        select, select option {text-transform:capitalize}
    </style>
</head>

<body class="min-h-screen bg-base-200">
    <div class="navbar bg-base-100 shadow-sm px-6">
        <div class="flex-1"><a href="/" class="text-xl font-bold"><span class="text-2xl">🥔</span><span class="">Solanum AI</span></a></div>
        <div class="flex-none">
            {% if user %}<span class="mr-4 text-sm opacity-70">{{ user }}</span>
            <a href="/logout" class="btn btn-sm btn-ghost">Logout</a>{% endif %}
        </div>
    </div>
    <main class="max-w-4xl mx-auto p-6">{% block content %}{% endblock %}</main>
</body>

</html>
